[project]
name = "deepstack"
version = "0.1.0"
description = "Tooling for deepstack: build, verify and test the lesson pages."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "playwright>=1.49",
]

[dependency-groups]
# Libraries used by the runnable code examples in examples/<topic>/.
examples = [
    "a2a-sdk[http-server]==1.1.5",
    "mcp==2.2.0",
    "pyjwt[crypto]>=2.10",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.10",
]

[tool.uv]
package = false
default-groups = ["dev", "examples"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["site", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["examples"]
addopts = "-q"
